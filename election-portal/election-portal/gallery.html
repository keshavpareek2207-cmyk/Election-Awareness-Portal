<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Matdaan Mitra Election Awareness Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <section>
    <h1>Gallery</h1>
    <p class="lead">Awareness drives and voting moments. Use the filters, and click a picture to enlarge it. Press Esc or click again to close.</p>
    <div id="galleryFilters" class="filters" aria-label="Filter gallery"></div>
    <!-- Tiles are created by JavaScript from the "photos" array in js/script.js -->
    <div id="galleryGrid" class="grid"></div>
  </section>
</main>

<div id="lightbox" aria-label="Enlarged picture"></div>
<div id="site-footer"></div>
<script src="js/script.js"></script>
</body>
</html>
