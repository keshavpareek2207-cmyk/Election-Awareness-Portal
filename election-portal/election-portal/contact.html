<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Matdaan Mitra Election Awareness Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <section>
    <h1>Contact us</h1>
    <p class="lead">Have a question about voting? Send us a message. There is no backend, so messages are saved only in your own browser.</p>
    <div class="cols">
      <!-- novalidate lets our JavaScript show the error messages instead of the browser -->
      <form id="contactForm" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <p class="err" id="nameErr"></p>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <p class="err" id="emailErr"></p>

        <label for="phone">Mobile number</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel">
        <p class="err" id="phoneErr"></p>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4"></textarea>
        <p class="err" id="messageErr"></p>

        <button class="btn" type="submit">Send message</button>
        <p id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <div>
        <h2>Saved messages</h2>
        <div id="msgList"></div>
        <p><button class="btn alt" id="clearMsgs" type="button">Clear saved messages</button></p>
        <h2>Need help now?</h2>
        <p>Call the Voter Helpline on <a href="tel:1950">1950</a> or visit <a href="https://voters.eci.gov.in" target="_blank" rel="noopener">voters.eci.gov.in</a>.</p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/script.js"></script>
</body>
</html>
